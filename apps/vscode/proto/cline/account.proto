syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

// Service for account-related operations
service AccountService {
  // Handles the user clicking the login link in the UI.
  // Generates a secure nonce for state validation, stores it in secrets,
  // and opens the authentication URL in the external browser.
  rpc accountLoginClicked(EmptyRequest) returns (String);

  // Handles the user clicking the logout button in the UI.
  // Clears API keys and user state.
  rpc accountLogoutClicked(EmptyRequest) returns (Empty);

  // Subscribe to auth status update events (when authentication state changes)
  rpc subscribeToAuthStatusUpdate(EmptyRequest) returns (stream AuthState);

  // Handles authentication state changes from the Firebase context.
  // Updates the user info in global state and returns the updated value.
  rpc authStateChanged(AuthStateChangedRequest) returns (AuthState);

  // Fetches all user credits data
  // (balance, usage transactions, payment transactions)
  rpc getUserCredits(EmptyRequest) returns (UserCreditsData);

  rpc getOrganizationCredits(GetOrganizationCreditsRequest) returns (OrganizationCreditsData);

  // Fetches all user organizations data
  // Returns a list of UserOrganization objects
  rpc getUserOrganizations(EmptyRequest) returns (UserOrganizationsResponse);

  rpc setUserOrganization(UserOrganizationUpdateRequest) returns (Empty);

  rpc openrouterAuthClicked(EmptyRequest) returns (Empty);

  rpc requestyAuthClicked(StringRequest) returns (Empty);

  rpc hicapAuthClicked(EmptyRequest) returns (Empty);

  // Returns a link the webview can use to redirect back to the user's IDE.
  rpc getRedirectUrl(EmptyRequest) returns (String);

  // OpenAI Codex OAuth authentication
  // Starts the OAuth flow and opens browser for user to sign in with ChatGPT Plus/Pro
  rpc openAiCodexSignIn(EmptyRequest) returns (Empty);

  // Signs out of OpenAI Codex and clears stored credentials
  rpc openAiCodexSignOut(EmptyRequest) returns (Empty);

  // Submits a spend limit increase request to the user's org admin.
  // Called when the user hits a SPEND_LIMIT_EXCEEDED (429) error and clicks "Request Increase".
  rpc submitLimitIncreaseRequest(EmptyRequest) returns (SubmitLimitIncreaseResponse);

  // Opengates (Ola Code) plan, allowance, and upgrade details from the Ola gateway.
  rpc getOpengatesAccount(EmptyRequest) returns (OpengatesAccount);

  // Starts an Opengates Pro checkout and opens it in the browser. Returns the checkout URL.
  rpc startOpengatesUpgrade(EmptyRequest) returns (String);

  rpc startOpengatesPlanCheckout(StringRequest) returns (String);
}

message OpengatesProduct {
  string id = 1;
  string currency = 2;
  // Price in the currency's minor unit (e.g. cents).
  int64 amount = 3;
  int32 days = 4;
  string tier = 5;
  string billing_version = 6;
  // Set for Sparks bundles and top-ups (priced in KES); plans have none.
  optional OpengatesBundleOffer bundle = 7;
  // False while a bundle is not sold (Hadi Usiku after 9 PM East Africa Time).
  bool on_sale = 8;
}

// How a bundle lasts: hours from purchase, until midnight, or a nightly window (East Africa Time).
// A top-up adds Sparks that never expire.
message OpengatesBundleOffer {
  string name = 1;
  string label = 2;
  int64 sparks = 3;
  int32 hours = 4;
  bool until_midnight = 5;
  bool windowed = 6;
  int32 from_hour = 7;
  int32 to_hour = 8;
  int32 sell_until_hour = 9;
  bool top_up = 10;
}

message OpengatesAccount {
  string tier = 1;
  string status = 2;
  int64 credits_remaining = 3;
  int64 fast_remaining = 4;
  int64 reason_remaining = 5;
  // Legacy client-guessed allowances. Do not use for usage display.
  int64 fast_allowance = 6 [deprecated = true];
  int64 reason_allowance = 7 [deprecated = true];
  optional string reset_at = 8;
  optional string expires_at = 9;
  optional OpengatesProduct upgrade_product = 10;
  // Current raw-token policy, not the proposed Standard/Premium budgets.
  optional int32 allowance_policy_version = 11;
  // Authoritative server limits; absent on older servers, -1 means unlimited.
  optional int64 fast_limit = 12;
  optional int64 reason_limit = 13;
  // Last shadow-only agent task snapshot, for evaluation display only.
  optional OpengatesAgentBudgetTask agent_budget_task = 14;
  optional OpengatesSparksWallet sparks = 15;
  repeated OpengatesSparksCall sparks_calls = 16;
  repeated OpengatesProduct products = 17;
  bool billing_enabled = 18;
}

message OpengatesSparksWallet {
  string version = 1;
  string unit = 2;
  int64 grant_nusd = 3;
  int64 used_nusd = 4;
  int64 held_nusd = 5;
  int64 purchased_nusd = 6;
  int64 purchased_held_nusd = 7;
  string period = 8;
  string reset_at = 9;
  // Bundles bought on their own, each with its own expiry; spent before the monthly Sparks.
  repeated OpengatesSparksBundle bundles = 10;
}

message OpengatesSparksBundle {
  string id = 1;
  string product = 2;
  int64 granted_nusd = 3;
  int64 used_nusd = 4;
  int64 held_nusd = 5;
  string starts_at = 6;
  string expires_at = 7;
  bool windowed = 8;
  int32 from_hour = 9;
  int32 to_hour = 10;
}

message OpengatesSparksCall {
  string id = 1;
  string parent = 2;
  string model = 3;
  string role = 4;
  string state = 5;
  string outcome = 6;
  int64 debit_nusd = 7;
  int64 held_nusd = 8;
  int64 prompt_tokens = 9;
  int64 cached_tokens = 10;
  int64 cache_write_tokens = 11;
  int64 completion_tokens = 12;
  string timestamp = 13;
}

message OpengatesAgentBudgetBalance {
  int64 grant_nusd = 1;
  int64 used_nusd = 2;
  int64 held_nusd = 3;
  int64 available_nusd = 4;
}

message OpengatesAgentBudgetTask {
  string mode = 1;
  bool enforcement_enabled = 2;
  bool customer_consumption = 3;
  bool risk_dependency_missing = 4;
  string id = 5;
  string policy_version = 6;
  string period = 7;
  string plan = 8;
  string preset = 9;
  int64 cap_nusd = 10;
  int64 shadow_used_nusd = 11;
  int64 shadow_held_nusd = 12;
  int32 iterations = 13;
  int32 max_iterations = 14;
  optional string deadline = 15;
  bool review_required = 16;
  bool premium_authorized = 17;
  optional OpengatesAgentBudgetBalance standard = 18;
  optional OpengatesAgentBudgetBalance premium = 19;
}

message AuthStateChangedRequest {
  Metadata metadata = 1;
  UserInfo user = 2;
}

message AuthState {
  optional UserInfo user = 1;
}

// User's information
message UserInfo {
  string uid = 1;
  optional string display_name = 2;
  optional string email = 3;
  optional string photo_url = 4;
  optional string app_base_url = 5; // Cline app base URL
}

message UserOrganization {
  bool active = 1;
  string member_id = 2;
  string name = 3;
  string organization_id = 4;
  repeated string roles = 5; // ["admin", "member", "owner"]
}

message UserOrganizationsResponse {
  repeated UserOrganization organizations = 1;
}

message UserOrganizationUpdateRequest {
  optional string organization_id = 1;
}

message UserCreditsData {
  UserCreditsBalance balance = 1;
  repeated UsageTransaction usage_transactions = 2;
  repeated PaymentTransaction payment_transactions = 3;
}

message GetOrganizationCreditsRequest {
  string organization_id = 1;
}

message OrganizationCreditsData {
  UserCreditsBalance balance = 1;
  string organization_id = 2;
  repeated OrganizationUsageTransaction usage_transactions = 3;
}

message UserCreditsBalance {
  double current_balance = 1;
}

message UsageTransaction {
  string ai_inference_provider_name = 1;
  string ai_model_name = 2;
  string ai_model_type_name = 3;
  int32 completion_tokens = 4;
  double cost_usd = 5;
  string created_at = 6;
  double credits_used = 7;
  string generation_id = 8;
  string organization_id = 9;
  int32 prompt_tokens = 10;
  int32 total_tokens = 11;
  string user_id = 12;
  string operation = 13;
}

// Response from a spend limit increase request submission
message SubmitLimitIncreaseResponse {
  bool success = 1;
}

message PaymentTransaction {
  string paid_at = 1;
  string creator_id = 2;
  int32 amount_cents = 3;
  double credits = 4;
}

message OrganizationUsageTransaction {
  string ai_inference_provider_name = 1;
  string ai_model_name = 2;
  string ai_model_type_name = 3;
  int32 completion_tokens = 4;
  double cost_usd = 5;
  string created_at = 6;
  double credits_used = 7;
  string generation_id = 8;
  string organization_id = 9;
  int32 prompt_tokens = 10;
  int32 total_tokens = 11;
  string user_id = 12;
  string operation = 13;
}
